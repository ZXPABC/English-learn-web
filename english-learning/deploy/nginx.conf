# nginx 反向代理配置:用户访问 80 端口,nginx 转发给后端的 FastAPI(8000 端口)
# 安装位置:/etc/nginx/sites-available/english-learning
server {
    listen 80;
    # 有域名就填域名;没有域名先填服务器公网 IP
    server_name 47.111.67.249;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
