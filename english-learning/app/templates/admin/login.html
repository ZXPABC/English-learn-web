<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · 轻松学英语</title>
  <link rel="stylesheet" href="/static/css/admin.css?v=20261005">
</head>
<body class="login-body">
  <div class="login-card">
    <h1>📚 轻松学英语</h1>
    <p class="login-sub">后台管理登录</p>
    {% if error %}<p class="login-error">⚠️ {{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" required autofocus>
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="login-hint">管理员账号:admin(默认密码在 app/seed.py 里配置)</p>
  </div>
</body>
</html>
